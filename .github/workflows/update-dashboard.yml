name: 🐯 Atualizar Dashboard CS

on:
  # Dispara automaticamente quando qualquer CSV é enviado para data/
  push:
    paths:
      - "data/freshdesk_*.csv"

  # Permite rodar manualmente pelo GitHub (botão "Run workflow")
  workflow_dispatch:

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # necessário para fazer commit de volta

    steps:
      # 1. Baixa o repositório
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Instala Python e dependências
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install pandas openpyxl

      # 3. Roda o processador
      - name: Processar dados e atualizar dashboard
        run: python scripts/process.py

      # 4. Commit automático do index.html atualizado
      - name: Commit dashboard atualizado
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "🐯 Dashboard atualizado automaticamente — $(date '+%d/%m/%Y %H:%M')"
          git push
